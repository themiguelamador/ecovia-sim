# Demand parameters. Every number here is a calibration knob: change it, re-run `make`,
# compare against counts (`make geh`). Sources noted where a number comes from one.

seed = 42
scale = 1.0                  # multiply every trip count (0.1 for quick test runs)
horizon = 2030               # projects with year <= horizon are in the demand (see [[projects]])
zone_size_m = 400            # grid cell size for inner zones

# --- mode choice (car share by distance) -------------------------------------------
# P(car) = car_share_max * (1 - exp(-d / car_half_km)). Short trips mostly walk.
# Census 2021 (PDM Vol. VI, Gráfico 2): 72.6% of commutes by car, 11.9% public transport,
# 15.3% walking/cycling. With these values a 3 km trip is ~72% car, a 500 m trip ~26%.
car_share_max = 0.78
car_half_km = 1.2
occupancy = 1.3              # people per car (escort trips, car-sharing)

# --- external demand (people from outside the study area) ----------------------------
# Residents of the rest of the municipality (INE census) are routed through the nearest
# gate (main road crossing the study-area border) by bearing. Traffic from other
# municipalities comes from [corridors]: PDM Vol. VI, Figura 4, TMDA 2021 on the national
# roads at the municipal border, both directions. Half of it is each direction;
# `corridor_to_city` of that reaches the study area (the rest stops in Taipas, Ponte,
# Pevidém...), and `through_share` of what arrives crosses without stopping.
# Check: the PDM estimates 69 000 vehicles/day entering the city (2019), "possibly close
# to 100 000" after the pandemic; demand.py prints the model's figure.
outside_trip_factor = 1.0    # scale for municipality residents outside the study area
corridor_to_city = 0.65          # calibrated so entries match the PDM 2019 estimate (~69 000/day)
through_share = 0.3
outside_activity = 0.5      # jobs/retail/schools per resident outside, relative to the centre's ratio

# --- pedestrians (walk trips cross the street at OSM crossings) -----------------------
# The non-car share of each trip is walked with probability exp(-d / walk_km); the rest is
# public transport or other modes (not simulated as people). Census 2021: 15.3% of commutes
# on foot or bike. Pedestrians walk on sidewalks and cross at the ~600 OSM crossings; at a
# marked crossing (passadeira) cars must stop for them.
walk_km = 1.5
pedestrian_scale = 1.0       # 0 = no pedestrians (faster runs)

# --- on-street parking and deliveries -------------------------------------------------
# Share of car trips ending/starting on local streets (residential, tertiary, unclassified,
# secondary) that park on the street, parallel to the kerb. Arriving: the car stops in its
# lane for a parking manoeuvre; leaving: it pulls out from standstill.
# CALIBRATED with the deliveries below so that Guimabus buses run at ~10 km/h in the
# morning peak, the PDM figure for the busiest urban lines (Vol. VI, p. 62). Tested
# (seed 1, buses leaving 7:30-9:00): 50%/10-25 s + 60%/5-15 min -> 7.6 km/h and near
# gridlock; 30%/8-15 s + 40%/3-10 min -> 8.2 km/h; 20%/8-15 s + 25%/3-10 min -> 10.0 km/h.
on_street_parking_share = 0.2
parking_manoeuvre_s = [8, 15]    # uniform range, seconds blocking the lane
# ASSUMPTION: delivery vans per retail unit per weekday, and the share that stop in the lane
# ("segunda fila") instead of a loading bay. Following cars wait or overtake by the
# opposite lane when it is free.
deliveries_per_retail_unit = 0.6
double_parking_share = 0.25      # calibrated, see above
delivery_stop_s = [180, 600]

# --- buses ------------------------------------------------------------------------------
# Guimabus GTFS 2026 (Minho Access Point, CC-BY), imported with SUMO's gtfs2pt for one
# school-term weekday: every trip, stop and timetable inside the study area. Buses stop in
# the lane at each stop (no bays), 20 s minimum. Intermunicipal lines (Transdev etc.) have no
# public GTFS and are not simulated.
gtfs_date = "20261007"

# --- trip generation -------------------------------------------------------------
# Trips per resident per day by purpose (all modes). IMob 2017 (INE): ~2.7 trips/person/day
# in the Norte region; split by purpose below. Return legs are generated automatically.
[purposes.work]              # home -> work, age 25-64
rate = 0.55
producer = "age_25_64"
attractor = "jobs"
beta_per_km = 0.25           # distance decay (higher = shorter trips)
out_profile = "am_commute"
back_profile = "pm_commute"
[purposes.education]         # home -> school/university (includes escort trips), age 0-24
rate = 0.55
producer = "age_0_24"
attractor = "education"
beta_per_km = 0.6
out_profile = "school_in"
back_profile = "school_out"
[purposes.shopping]          # home -> retail/services
rate = 0.35
producer = "residents"
attractor = "retail"
beta_per_km = 0.5
out_profile = "shopping"
back_profile = "shopping_back"
[purposes.non_home]          # work/retail -> retail (errands, lunch, business)
rate = 0.25
producer = "jobs"            # per job
attractor = "retail"
beta_per_km = 0.7
out_profile = "midday"
back_profile = ""            # no return leg

[corridors]                  # bearing from the centre (degrees) and TMDA 2021, both directions
noroeste = { bearing = 315, tmda = 33606 }   # Braga, EN101 / A11
poente = { bearing = 270, tmda = 41524 }     # Famalicão, EN206 / A7
sudoeste = { bearing = 225, tmda = 22084 }   # Santo Tirso, EN105
sul = { bearing = 180, tmda = 19459 }        # Vizela, EN106
nascente = { bearing = 90, tmda = 21455 }    # Fafe, EN206 / A7

[gate_weight]                # how a corridor's traffic splits between its gates, by road class
"highway.motorway" = 6
"highway.trunk" = 5
"highway.primary" = 3
"highway.secondary" = 2
"highway.tertiary" = 1

# --- attraction weights from OpenStreetMap -----------------------------------------
# Units: jobs / education places / retail "units" per feature. Heavy features closer
# than 300 m to one already counted are skipped (OSM tags campus + each building).
[attractors]
shop = { jobs = 3, retail = 1 }
"shop=supermarket" = { jobs = 25, retail = 15 }
"shop=mall" = { jobs = 300, retail = 80, heavy = true }
"amenity=restaurant" = { jobs = 5, retail = 0.6 }
"amenity=cafe" = { jobs = 2, retail = 0.4 }
"amenity=fast_food" = { jobs = 3, retail = 0.5 }
"amenity=bar" = { jobs = 2, retail = 0.3 }
"amenity=bank" = { jobs = 10, retail = 1.5 }
"amenity=pharmacy" = { jobs = 5, retail = 1.5 }
"amenity=post_office" = { jobs = 10, retail = 1.5 }
"amenity=clinic" = { jobs = 30, retail = 3 }
"amenity=doctors" = { jobs = 8, retail = 1 }
"amenity=townhall" = { jobs = 200, retail = 5, heavy = true }
"amenity=courthouse" = { jobs = 80, retail = 3, heavy = true }
"amenity=kindergarten" = { jobs = 12, education = 60 }
"amenity=school" = { jobs = 50, education = 400, heavy = true }
"amenity=college" = { jobs = 60, education = 500, heavy = true }
"amenity=university" = { jobs = 400, education = 4000, heavy = true }
"amenity=hospital" = { jobs = 1500, retail = 40, heavy = true }
office = { jobs = 15 }
craft = { jobs = 4 }
"landuse=industrial" = { jobs_per_ha = 40 }
"landuse=commercial" = { jobs_per_ha = 60, retail_per_ha = 5 }
"landuse=retail" = { jobs_per_ha = 40, retail_per_ha = 20 }

# --- named facilities -----------------------------------------------------------------
# Override the generic OSM weights for large facilities with their own numbers, and add
# planned ones. `replaces` drops OSM features of that key within `radius_m` (so the campus
# and each of its buildings are not counted again). `year` > horizon = not built yet.
# visitors are in retail units (1 unit ~ a small shop's pull).
[[projects]]
name = "Universidade do Minho – Campus de Azurém"
lon = -8.28947
lat = 41.45295
year = 0
education = 6500             # ASSUMPTION: ~1/3 of UMinho's ~20 000 students; confirm with UMinho
jobs = 700
replaces = "amenity=university"
radius_m = 600

[[projects]]
name = "Hospital da Senhora da Oliveira"
lon = -8.30518
lat = 41.44216
year = 0
jobs = 2300                  # ASSUMPTION: order of magnitude of staff; confirm with ULS Alto Ave
retail = 60                  # outpatients and visitors
replaces = "amenity=hospital"
radius_m = 700

[[projects]]
name = "Campus da Justiça (previsto)"
lon = -8.27367
lat = 41.44783               # Academia de Ginástica site, next to the Parque da Cidade
year = 2029
jobs = 450                   # ASSUMPTION: magistrates, officials, lawyers; no public figure found
retail = 40                  # ASSUMPTION: ~1 200 users/day
replaces = "amenity=courthouse"  # the campus concentrates the courts now spread around the centre
radius_m = 2500

